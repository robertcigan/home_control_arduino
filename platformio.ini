; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -Wno-unused-variable  ; suppress EEPROM warning from Arduino framework
lib_deps =
	robtillaart/DS18B20 @ ^0.1.15
	bblanchon/ArduinoJson@6.18.5
	paulstoffregen/OneWire @ ^2.3.8
	arduino-libraries/Ethernet @ ^2.0.2

[env:esp8266]
platform = espressif8266
framework = arduino
board = esp01_1m
lib_deps =
	robtillaart/DS18B20 @ ^0.1.7
	paulstoffregen/OneWire @ ^2.3.7
	robtillaart/DS18B20 @ ^0.1.15
	bblanchon/ArduinoJson@6.18.5
upload_speed = 115200
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.1m64.ld  ; 64KB FS, ~467KB OTA limit

[env:nodemcu32s]
framework = arduino
board = nodemcu-32s
platform = espressif32
lib_deps =
	robtillaart/DS18B20 @ ^0.1.15
	bblanchon/ArduinoJson@6.18.5
	https://github.com/promillen/OneWire/archive/refs/heads/patch-1.zip
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = min_spiffs.csv  ; Larger app partition for OTA
board_build.filesystem = littlefs

[env:esp32c3mini]
framework = arduino
board = lolin_c3_mini
platform = espressif32
lib_deps =
	robtillaart/DS18B20 @ ^0.1.15
	bblanchon/ArduinoJson@6.18.5
	https://github.com/promillen/OneWire/archive/refs/heads/patch-1.zip
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = min_spiffs.csv  ; Larger app partition (1.9MB app + 190KB SPIFFS)
board_build.filesystem = littlefs
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; ==================== OTA Updates ====================
; OTA is done via web interface at http://<device-ip>/update
; or via server command: {"update": {"url": "http://server/firmware.bin"}}