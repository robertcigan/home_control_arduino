; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
	robtillaart/DS18B20 @ ^0.1.15
	bblanchon/ArduinoJson@6.18.5
	paulstoffregen/OneWire @ ^2.3.8
	arduino-libraries/Ethernet @ ^2.0.2

[env:esp8266]
platform = espressif8266
framework = arduino
board = esp01_1m
lib_deps =
	robtillaart/DS18B20 @ ^0.1.7
	paulstoffregen/OneWire @ ^2.3.7
	robtillaart/DS18B20 @ ^0.1.15
	bblanchon/ArduinoJson@6.18.5
upload_speed = 115200
monitor_speed = 115200

[env:nodemcu32s]
framework = arduino
board = nodemcu-32s
platform = espressif32
lib_deps =
	robtillaart/DS18B20 @ ^0.1.15
	bblanchon/ArduinoJson@6.18.5
	https://github.com/promillen/OneWire/archive/refs/heads/patch-1.zip
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = min_spiffs.csv  ; Larger app partition for OTA

[env:esp32c3mini]
framework = arduino
board = lolin_c3_mini
platform = espressif32
lib_deps =
	robtillaart/DS18B20 @ ^0.1.15
	bblanchon/ArduinoJson@6.18.5
	https://github.com/promillen/OneWire/archive/refs/heads/patch-1.zip
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = min_spiffs.csv  ; Larger app partition (1.9MB app + 190KB SPIFFS)
board_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

; ==================== OTA Upload Environments ====================
; Use these environments for Over-The-Air firmware updates
; First upload must be via USB, subsequent uploads can use OTA
;
; Usage: pio run -e esp8266_ota -t upload --upload-port 192.168.0.XX
; Or set upload_port below to the device IP address

[env:esp8266_ota]
platform = espressif8266
framework = arduino
board = esp01_1m
lib_deps =
	robtillaart/DS18B20 @ ^0.1.7
	paulstoffregen/OneWire @ ^2.3.7
	robtillaart/DS18B20 @ ^0.1.15
	bblanchon/ArduinoJson@6.18.5
monitor_speed = 115200
upload_protocol = espota
upload_port = 192.168.0.XXX  ; Replace with device IP or hostname.local
; upload_flags = --auth=password  ; Uncomment if password is set

[env:nodemcu32s_ota]
framework = arduino
board = nodemcu-32s
platform = espressif32
lib_deps =
	robtillaart/DS18B20 @ ^0.1.15
	bblanchon/ArduinoJson@6.18.5
	https://github.com/promillen/OneWire/archive/refs/heads/patch-1.zip
monitor_speed = 115200
board_build.partitions = min_spiffs.csv  ; Larger app partition for OTA
upload_protocol = espota
upload_port = 192.168.0.XXX  ; Replace with device IP or hostname.local
upload_flags = --port=3232

[env:esp32c3mini_ota]
framework = arduino
board = lolin_c3_mini
platform = espressif32
lib_deps =
	robtillaart/DS18B20 @ ^0.1.15
	bblanchon/ArduinoJson@6.18.5
	https://github.com/promillen/OneWire/archive/refs/heads/patch-1.zip
monitor_speed = 115200
board_build.partitions = min_spiffs.csv  ; Larger app partition (1.9MB app + 190KB SPIFFS)
board_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
upload_protocol = espota
upload_port = 192.168.0.XXX  ; Replace with device IP or hostname.local
upload_flags = --port=3232